name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: base (Plone ${{ matrix.plone-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plone-version: ["6.0.15", "6.1.5", "6.2.2"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Plone with Python
        uses: plone/setup-plone@v2.0.0
        with:
          python-version: "3.12"
          plone-version: ${{ matrix.plone-version }}

      - name: Install package
        run: |
          pip install -e ".[test]"
          # Several Plone dependencies still import pkg_resources at runtime.
          pip install "setuptools<81"

      - name: Run tests
        # Invoke via `python -m` so it does not depend on the zope-testrunner
        # console script being on PATH.
        run: python -m zope.testrunner --test-path=. -m collective.xsendfile

  package:
    name: package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check sdist contents, build and check distributions
        run: |
          pip install build check-manifest twine
          check-manifest
          python -m build
          twine check --strict dist/*
